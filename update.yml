name: Update leaks

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you press a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect new leaks
        run: python scripts/update.py

      - name: Save changes
        run: |
          git config user.name "leak-bot"
          git config user.email "leak-bot@users.noreply.github.com"
          git add data/leaks.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update leaks"
            git push
          fi
